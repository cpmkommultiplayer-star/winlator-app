android.useAndroidX=true
# GeckoView is large enough that shrinking it needs more heap than the default.
org.gradle.jvmargs=-Xmx6144m -Dfile.encoding=UTF-8
android.enableJetifier=true
android.nonFinalResIds=false
android.nonTransitiveRClass=false
# GeckoView is already AndroidX and is far too large for Jetifier to rewrite in memory.
android.jetifier.ignorelist=geckoview.*
